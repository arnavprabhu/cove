<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cove — Installing macOS</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#1E1E1E}
a{color:#4DA3FF;text-decoration:none}a:hover{color:#7DBBFF}
.pbtn:hover{background:#1A7FEA;color:#FFFFFF}
.sbtn:hover{background:#48484A;color:#F5F5F7}
</style>
</helmet>
<div style="width: 1200px; height: 760px; box-sizing: border-box; display: flex; flex-direction: column; background: #1E1E1E; color: #F5F5F7; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.10)">

  <div style="height: 52px; flex: 0 0 52px; display: flex; align-items: center; padding: 0 20px; position: relative; border-bottom: 1px solid rgba(255,255,255,0.08); background: #262628">
    <div style="display: flex; gap: 8px">
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #28C840"></span>
    </div>
    <div style="position: absolute; left: 0; right: 0; text-align: center; font-size: 13px; font-weight: 600; pointer-events: none">Installing “macOS VM”</div>
  </div>

  <div style="flex: 1 1 auto; display: flex; gap: 48px; padding: 48px 64px 32px; min-height: 0; align-items: center">
    <div style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; gap: 22px">
      <div style="width: 400px; height: 260px; border-radius: 18px; border: 5px solid #E5E5EA; background: #141415; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center">
        <div style="position: absolute; left: 0; bottom: 0; right: 0; height: {{fillH}}; background: rgba(10,132,255,0.22); transition: height 0.2s linear"></div>
        <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px">
          <span style="font-size: 54px; font-weight: 700; letter-spacing: -1px; font-variant-numeric: tabular-nums">{{pct}}%</span>
          <span style="font-size: 13px; color: #A1A1A6">{{stageShort}}</span>
        </div>
      </div>
      <div style="width: 72px; height: 6px; border-radius: 3px; background: #E5E5EA; margin-top: -10px"></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 8px">
        <h1 style="margin: 0; font-size: 24px; font-weight: 700">{{headline}}</h1>
        <span style="font-size: 14px; color: #A1A1A6; font-variant-numeric: tabular-nums">{{detail}}</span>
      </div>
      <div style="width: 400px; height: 6px; border-radius: 3px; background: #3A3A3C; overflow: hidden"><div style="height: 6px; width: {{barW}}; background: #0A84FF; border-radius: 3px"></div></div>
    </div>

    <div style="width: 400px; flex: 0 0 400px; display: flex; flex-direction: column; gap: 14px">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: #8E8E93">Steps</div>
      <div style="display: flex; flex-direction: column; background: #262628; border: 1px solid rgba(255,255,255,0.07); border-radius: 14px">
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
          <div style="display: flex; gap: 14px; padding: 16px 18px; border-bottom: 1px solid rgba(255,255,255,0.06)">
            <sc-if value="{{s.done}}" hint-placeholder-val="{{false}}">
              <span style="width: 24px; height: 24px; border-radius: 50%; background: #30D158; color: #0B3D1A; display: flex; align-items: center; justify-content: center; flex: 0 0 auto"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
            </sc-if>
            <sc-if value="{{s.active}}" hint-placeholder-val="{{false}}">
              <span style="width: 24px; height: 24px; border-radius: 50%; border: 3px solid #0A84FF; border-right-color: #3A3A3C; box-sizing: border-box; flex: 0 0 auto"></span>
            </sc-if>
            <sc-if value="{{s.pending}}" hint-placeholder-val="{{true}}">
              <span style="width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #545458; box-sizing: border-box; flex: 0 0 auto"></span>
            </sc-if>
            <span style="display: flex; flex-direction: column; gap: 3px">
              <span style="font-size: 14px; font-weight: 600; color: {{s.color}}">{{s.title}}</span>
              <span style="font-size: 12px; color: #8E8E93; line-height: 17px">{{s.note}}</span>
            </span>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #262628; font-size: 12px; line-height: 17px; color: #A1A1A6">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="flex: 0 0 auto; margin-top: 1px" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>
        <span>You can close this window. Installation keeps going and Cove sends a notification when your VM is ready.</span>
      </div>
    </div>
  </div>

  <div style="height: 64px; flex: 0 0 64px; display: flex; align-items: center; gap: 10px; padding: 0 24px; border-top: 1px solid rgba(255,255,255,0.08); background: #232325">
    <a class="sbtn" href="Main.dc.html" style="height: 30px; padding: 0 16px; border-radius: 7px; background: #3A3A3C; color: #F5F5F7; display: inline-flex; align-items: center; font-size: 13px">Cancel Installation</a>
    <span style="flex: 1 1 auto"></span>
    <sc-if value="{{notDone}}" hint-placeholder-val="{{true}}">
      <a class="sbtn" href="Library.dc.html" style="height: 30px; padding: 0 16px; border-radius: 7px; background: #3A3A3C; color: #F5F5F7; display: inline-flex; align-items: center; font-size: 13px">Continue in Background</a>
    </sc-if>
    <sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
      <a class="pbtn" href="Console.dc.html" style="height: 30px; padding: 0 18px; border-radius: 7px; background: #0071E3; color: #FFFFFF; display: inline-flex; align-items: center; font-size: 13px; font-weight: 600">Open VM</a>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":760}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { t: 58 }; }
  componentDidMount() {
    this.timer = setInterval(() => {
      if (this.state.t >= 270) { clearInterval(this.timer); return; }
      this.setState({ t: this.state.t + 1 });
    }, 140);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    var t = this.state.t;
    var stage = t < 100 ? 1 : t < 200 ? 2 : t < 260 ? 3 : 4;
    var local = stage === 1 ? t : stage === 2 ? t - 100 : stage === 3 ? Math.round((t - 200) / 60 * 100) : 100;
    var total = 17.9, got = (total * local / 100).toFixed(1);
    var heads = ['', 'Downloading macOS', 'Installing macOS', 'Starting for the first time', 'Your VM is ready'];
    var shorts = ['', 'Restore image', 'Installing', 'First boot', 'Done'];
    var details = ['',
      got + ' GB of ' + total + ' GB · about ' + Math.max(1, Math.ceil((100 - local) / 20)) + ' min left',
      'Writing macOS to the virtual disk · about ' + Math.max(1, Math.ceil((100 - local) / 10)) + ' min left',
      'Booting into Setup Assistant',
      'macOS installed. Open it to finish Setup Assistant.'];
    var defs = [
      { title: 'Check this Mac', note: 'Apple silicon, disk space and macOS version' },
      { title: 'Download restore image', note: 'Signed by Apple · kept for future VMs' },
      { title: 'Install macOS', note: 'Takes about 10 minutes' },
      { title: 'First boot', note: 'You finish Setup Assistant in the VM window' }
    ];
    var steps = defs.map(function (d, i) {
      var done = i < stage || stage === 4, active = i === stage && stage < 4;
      return { title: d.title, note: d.note, done: done, active: active, pending: !done && !active, color: (done || active) ? '#F5F5F7' : '#8E8E93' };
    });
    return {
      pct: local, barW: local + '%', fillH: local + '%',
      headline: heads[stage], stageShort: shorts[stage], detail: details[stage],
      steps: steps, isDone: stage === 4, notDone: stage !== 4
    };
  }
}
</script>
</body>
</html>
