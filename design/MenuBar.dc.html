<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cove — Menu Bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#2A2A2D}
a{color:#F5F5F7;text-decoration:none}a:hover{color:#FFFFFF}
.mi{display:flex;align-items:center;gap:8px;height:24px;padding:0 10px;border-radius:5px;font-size:13px;color:#F5F5F7}
.mi:hover{background:#0058D0;color:#FFFFFF}
.tg{width:28px;height:28px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
</style>
</helmet>
<div style="width: 360px; height: 520px; box-sizing: border-box; display: flex; flex-direction: column; background: #2A2A2D; color: #F5F5F7; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.14); padding: 6px">
  <div style="display: flex; align-items: center; gap: 10px; padding: 10px 10px 12px">
    <svg width="28" height="28" viewBox="0 0 128 128" aria-hidden="true"><rect x="4" y="4" width="120" height="120" rx="28" fill="#3A3A3D"></rect><rect x="22" y="28" width="84" height="62" rx="9" fill="none" stroke="#E5E5EA" stroke-width="6"></rect><rect x="36" y="41" width="56" height="36" rx="6" fill="#0A84FF"></rect><rect x="52" y="96" width="24" height="6" rx="3" fill="#E5E5EA"></rect></svg>
    <div style="display: flex; flex-direction: column; flex: 1 1 auto"><span style="font-size: 13px; font-weight: 700">Cove</span><span style="font-size: 11px; color: #A1A1A6">{{summary}}</span></div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 0 6px 10px">
    <div style="background: rgba(255,255,255,0.06); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 11px; color: #A1A1A6">CPU in use by VMs</span><span style="height: 4px; border-radius: 2px; background: #48484A; overflow: hidden; display: block"><span style="display: block; height: 4px; width: {{cpuW}}; background: #0A84FF"></span></span></div>
    <div style="background: rgba(255,255,255,0.06); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 11px; color: #A1A1A6">{{memText}}</span><span style="height: 4px; border-radius: 2px; background: #48484A; overflow: hidden; display: block"><span style="display: block; height: 4px; width: {{memW}}; background: #0A84FF"></span></span></div>
  </div>
  <div style="height: 1px; background: rgba(255,255,255,0.1); margin: 0 10px 6px"></div>
  <div style="font-size: 11px; font-weight: 600; color: #8E8E93; padding: 4px 10px">Virtual Machines</div>
  <sc-for list="{{vms}}" as="vm" hint-placeholder-count="3">
    <div style="display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px">
      <span style="width: 30px; height: 20px; border-radius: 3px; border: 1.5px solid #A1A1A6; display: flex; align-items: center; justify-content: center; flex: 0 0 auto"><span style="width: 18px; height: 10px; border-radius: 2px; background: {{vm.screen}}"></span></span>
      <span style="display: flex; flex-direction: column; flex: 1 1 auto"><span style="font-size: 13px">{{vm.name}}</span><span style="font-size: 11px; color: #A1A1A6; display: flex; align-items: center; gap: 5px"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{vm.dot}}"></span>{{vm.status}}</span></span>
      <button class="tg" type="button" onClick="{{vm.toggle}}" aria-label="{{vm.label}}" style="background: {{vm.btnBg}}; color: {{vm.btnFg}}">
        <sc-if value="{{vm.on}}" hint-placeholder-val="{{false}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg></sc-if>
        <sc-if value="{{vm.off}}" hint-placeholder-val="{{true}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"></path></svg></sc-if>
      </button>
    </div>
  </sc-for>
  <sc-if value="{{limit}}" hint-placeholder-val="{{false}}">
    <div style="margin: 6px 10px; padding: 10px; border-radius: 8px; background: rgba(255,159,10,0.14); font-size: 11px; line-height: 15px; color: #FFD18A">Two macOS VMs are already running — the most Apple's license allows on one Mac. Stop or suspend one first.</div>
  </sc-if>
  <div style="flex: 1 1 auto"></div>
  <div style="height: 1px; background: rgba(255,255,255,0.1); margin: 6px 10px"></div>
  <a class="mi" href="Create.dc.html">New Virtual Machine…</a>
  <a class="mi" href="Library.dc.html">Open Cove Library<span style="flex: 1 1 auto"></span><span style="color: #8E8E93">⌘L</span></a>
  <a class="mi" href="AppSettings.dc.html">Settings…<span style="flex: 1 1 auto"></span><span style="color: #8E8E93">⌘,</span></a>
  <div style="height: 1px; background: rgba(255,255,255,0.1); margin: 6px 10px"></div>
  <a class="mi" href="Main.dc.html">Quit Cove<span style="flex: 1 1 auto"></span><span style="color: #8E8E93">⌘Q</span></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":520}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { st: ['run', 'susp', 'off'], limit: false }; }
  renderVals() {
    var names = ['Tahoe Dev', 'Sequoia QA', 'Clean Sonoma'];
    var mems = [8, 6, 8];
    var st = this.state.st;
    var running = st.filter(function (x) { return x === 'run'; }).length;
    var memUsed = st.reduce(function (a, x, i) { return a + (x === 'run' ? mems[i] : 0); }, 0);
    var vms = names.map((n, i) => {
      var on = st[i] === 'run';
      return {
        name: n, on: on, off: !on,
        status: on ? 'Running' : st[i] === 'susp' ? 'Suspended' : 'Stopped',
        dot: on ? '#30D158' : st[i] === 'susp' ? '#FF9F0A' : '#8E8E93',
        screen: on ? '#5E8BD6' : '#545458',
        label: on ? 'Stop ' + n : 'Start ' + n,
        btnBg: on ? 'rgba(255,255,255,0.12)' : '#0071E3',
        btnFg: '#FFFFFF',
        toggle: () => {
          var next = st.slice();
          if (on) { next[i] = 'off'; this.setState({ st: next, limit: false }); return; }
          if (running >= 2) { this.setState({ limit: true }); return; }
          next[i] = 'run'; this.setState({ st: next, limit: false });
        }
      };
    });
    return {
      vms: vms, limit: this.state.limit,
      summary: running === 0 ? 'No VMs running' : running + ' of 2 macOS VMs running',
      cpuW: (running * 22) + '%', memW: Math.round(memUsed / 36 * 100) + '%',
      memText: 'Memory · ' + memUsed + ' GB of 36 GB'
    };
  }
}
</script>
</body>
</html>
