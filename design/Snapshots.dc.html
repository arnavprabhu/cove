<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cove — Snapshots</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#1E1E1E}
a{color:#4DA3FF;text-decoration:none}a:hover{color:#7DBBFF}
.pbtn:hover{background:#1A7FEA;color:#FFFFFF}
.sbtn:hover{background:#48484A;color:#F5F5F7}
.snap{width:100%;display:flex;gap:14px;padding:12px 14px;border:0;border-radius:10px;font:inherit;text-align:left;color:#F5F5F7;align-items:flex-start}
</style>
</helmet>
<div style="width: 1200px; height: 760px; box-sizing: border-box; display: flex; flex-direction: column; background: #1E1E1E; color: #F5F5F7; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.10)">

  <div style="height: 52px; flex: 0 0 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px 0 20px; background: #262628; border-bottom: 1px solid rgba(255,255,255,0.08)">
    <div style="display: flex; gap: 8px; margin-right: 14px">
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #28C840"></span>
    </div>
    <a href="Library.dc.html" aria-label="Back" style="width: 28px; height: 28px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; color: #C7C7CC"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="display: flex; flex-direction: column; flex: 1 1 auto"><span style="font-size: 15px; font-weight: 700">Snapshots</span><span style="font-size: 11px; color: #8E8E93">Tahoe Dev · 3 snapshots · 16.7 GB</span></div>
    <button class="pbtn" type="button" style="height: 30px; padding: 0 14px; border-radius: 7px; border: 0; background: #0071E3; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2.5l1.5-2h6l1.5 2H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Take Snapshot</button>
  </div>

  <div style="flex: 1 1 auto; display: flex; min-height: 0">
    <div style="width: 400px; flex: 0 0 400px; padding: 20px 16px; border-right: 1px solid rgba(255,255,255,0.07); display: flex; flex-direction: column; gap: 4px; position: relative">
      <div style="position: absolute; left: 40px; top: 44px; bottom: 120px; width: 2px; background: #3A3A3C"></div>
      <sc-for list="{{snaps}}" as="sn" hint-placeholder-count="4">
        <button class="snap" type="button" onClick="{{sn.pick}}" style="background: {{sn.bg}}; position: relative">
          <span style="width: 22px; height: 22px; border-radius: 50%; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; background: {{sn.nodeBg}}; border: 2px solid {{sn.nodeBorder}}; box-sizing: border-box"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{sn.nodeDot}}"></span></span>
          <span style="display: flex; flex-direction: column; gap: 3px; flex: 1 1 auto">
            <span style="display: flex; align-items: center; gap: 8px"><span style="font-size: 14px; font-weight: 600">{{sn.name}}</span><sc-if value="{{sn.mem}}" hint-placeholder-val="{{false}}"><span style="font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 8px; background: rgba(255,255,255,0.10); color: #D1D1D6">+ memory</span></sc-if></span>
            <span style="font-size: 12px; color: {{sn.sub}}">{{sn.when}}</span>
          </span>
          <span style="font-size: 12px; color: {{sn.sub}}; font-variant-numeric: tabular-nums">{{sn.size}}</span>
        </button>
      </sc-for>
      <div style="flex: 1 1 auto"></div>
      <div style="display: flex; gap: 10px; padding: 12px; border-radius: 10px; background: #262628; font-size: 12px; line-height: 17px; color: #A1A1A6">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="flex: 0 0 auto; margin-top: 1px" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.5"></path></svg>
        <span>Snapshots are instant APFS clones, so each one only stores what changed after it.</span>
      </div>
    </div>

    <div style="flex: 1 1 auto; padding: 28px 36px; display: flex; flex-direction: column; gap: 18px; min-width: 0">
      <div style="height: 340px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.10); position: relative; overflow: hidden; background: radial-gradient(circle at 25% 30%, #3E5C9A 0%, transparent 45%), radial-gradient(circle at 75% 70%, #8A4F6E 0%, transparent 50%), #1B2238">
        <div style="position: absolute; left: 80px; top: 60px; width: 340px; height: 190px; border-radius: 8px; background: rgba(30,30,32,0.92); border: 1px solid rgba(255,255,255,0.12)"></div>
        <div style="position: absolute; left: 12px; bottom: 12px; padding: 4px 10px; border-radius: 8px; background: rgba(20,20,22,0.75); font-size: 11px; color: #D1D1D6">{{cur.when}}</div>
      </div>
      <div style="display: flex; align-items: flex-start; gap: 16px">
        <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 6px">
          <label style="font-size: 12px; color: #A1A1A6">Name</label>
          <div style="height: 32px; display: flex; align-items: center; padding: 0 10px; border-radius: 7px; border: 1px solid #48484A; background: #1C1C1E; font-size: 15px; font-weight: 600">{{cur.name}}</div>
          <div style="font-size: 12px; color: #8E8E93; margin-top: 4px">{{cur.detail}}</div>
        </div>
      </div>
      <div style="flex: 1 1 auto"></div>
      <sc-if value="{{cur.restorable}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px; background: rgba(255,159,10,0.12); border: 1px solid rgba(255,159,10,0.3); font-size: 12px; color: #FFD18A">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9.5 17h-19z"></path><path d="M12 10v4.5M12 17.5v.3"></path></svg>
          <span>Restoring replaces the current state. Cove takes an automatic snapshot of “Now” first, so you can come back.</span>
        </div>
      </sc-if>
      <div style="display: flex; gap: 8px">
        <button class="sbtn" type="button" style="height: 30px; padding: 0 14px; border-radius: 7px; border: 0; background: #3A3A3C; color: #FF6961; font: inherit; font-size: 13px">Delete</button>
        <span style="flex: 1 1 auto"></span>
        <button class="sbtn" type="button" style="height: 30px; padding: 0 14px; border-radius: 7px; border: 0; background: #3A3A3C; color: #F5F5F7; font: inherit; font-size: 13px">Clone to New VM…</button>
        <a class="pbtn" href="Console.dc.html" style="height: 30px; padding: 0 18px; border-radius: 7px; background: #0071E3; color: #FFFFFF; display: inline-flex; align-items: center; font-size: 13px; font-weight: 600">{{cur.action}}</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":760}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: 1 }; }
  renderVals() {
    var data = [
      { name: 'Now', when: 'Current state · running', size: '', mem: false, now: true, detail: 'Everything since “Before beta 3”.', action: 'Show Window' },
      { name: 'Before beta 3', when: 'Yesterday, 6:12 PM', size: '2.1 GB', mem: true, detail: 'Taken while running · includes memory, so it resumes with apps open.', action: 'Restore' },
      { name: 'Xcode installed', when: 'Oct 2, 11:40 AM', size: '14.6 GB', mem: false, detail: 'Taken while shut down · starts with a normal boot.', action: 'Restore' },
      { name: 'Fresh install', when: 'Sep 28, 9:03 PM', size: '0 KB', mem: false, detail: 'Right after Setup Assistant. Shares its data with the VM disk.', action: 'Restore' }
    ];
    var s = this.state.sel;
    var snaps = data.map((d, i) => ({
      name: d.name, when: d.when, size: d.size, mem: d.mem,
      bg: i === s ? '#0058D0' : 'transparent',
      sub: i === s ? '#DCE9FF' : '#8E8E93',
      nodeBg: d.now ? '#30D158' : '#1E1E1E',
      nodeBorder: d.now ? '#30D158' : (i === s ? '#FFFFFF' : '#636366'),
      nodeDot: d.now ? '#0B3D1A' : (i === s ? '#FFFFFF' : '#636366'),
      pick: () => this.setState({ sel: i })
    }));
    var c = data[s];
    return { snaps: snaps, cur: { name: c.name, when: c.when, detail: c.detail, action: c.action, restorable: !c.now } };
  }
}
</script>
</body>
</html>
