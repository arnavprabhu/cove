<svg xmlns="http://www.w3.org/2000/svg" width="872" height="328" viewBox="0 0 872 328" role="img" aria-label="Cove at a glance">
<title>Cove at a glance</title>
<style>.n{font:700 38px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#0066CC;letter-spacing:-0.5px}.l{font:600 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#1f2328}.s{font:400 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#59636e}.c{font:500 12.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;fill:#1f2328}</style>
<g transform="translate(0,0)">
<rect x="0.5" y="0.5" width="279" height="155" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<text class="n" x="22" y="58">1 click</text>
<text class="l" x="22" y="84">to a fresh Mac</text>
<text class="s" x="22" y="112">Cove downloads the latest macOS from</text>
<text class="s" x="22" y="131">Apple, installs it and starts it up.</text>
</g>
<g transform="translate(296,0)">
<rect x="0.5" y="0.5" width="279" height="155" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<text class="n" x="22" y="58">~15 min</text>
<text class="l" x="22" y="84">to install macOS</text>
<text class="s" x="22" y="112">On an M5 Pro, after a one-time 26.6 GB</text>
<text class="s" x="22" y="131">download that’s kept for future VMs.</text>
</g>
<g transform="translate(592,0)">
<rect x="0.5" y="0.5" width="279" height="155" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<text class="n" x="22" y="58">0 bytes</text>
<text class="l" x="22" y="84">of disk copied per snapshot</text>
<text class="s" x="22" y="112">Snapshots are APFS clones: each one</text>
<text class="s" x="22" y="131">stores only what changes after it.</text>
</g>
<g transform="translate(0,172)">
<rect x="0.5" y="0.5" width="279" height="155" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<text class="n" x="22" y="58">1 command</text>
<text class="l" x="22" y="84">for you and your agents</text>
<rect x="20" y="98" width="126" height="20" rx="5" fill="#eaeef2"/>
<text class="c" x="26" y="112">ssh cove-&lt;name&gt;</text>
<text class="s" x="22" y="131">from Terminal or any local agent.</text>
</g>
<g transform="translate(296,172)">
<rect x="0.5" y="0.5" width="279" height="155" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<text class="n" x="22" y="58">2</text>
<text class="l" x="22" y="84">macOS VMs running at once</text>
<text class="s" x="22" y="112">The most Apple’s macOS license allows</text>
<text class="s" x="22" y="131">on one Mac. Cove keeps count.</text>
</g>
<g transform="translate(592,172)">
<rect x="0.5" y="0.5" width="279" height="155" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<text class="n" x="22" y="58">100%</text>
<text class="l" x="22" y="84">Apple Virtualization.framework</text>
<text class="s" x="22" y="112">No kernel extensions, no QEMU,</text>
<text class="s" x="22" y="131">no background helpers to install.</text>
</g>
</svg>
